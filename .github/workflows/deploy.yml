name: Deploy Django to Azure

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: Hadinarim
  PYTHON_VERSION: "3.12"

jobs:
  build-test-deploy:
    runs-on: windows-2022

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ODBC Driver for SQL Server
        run: |
          choco install sqlserver-odbcdriver --yes

      - name: Run tests
        run: |
          python manage.py test --keepdb

      - name: Zip app
        shell: pwsh
        run: |
          if (Test-Path app.zip) { Remove-Item app.zip }
          Get-ChildItem -Path . -Exclude ".git","venv",".venv","__pycache__","db.sqlite3",".env","app.zip" |
          Compress-Archive -DestinationPath app.zip -Force

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Run database migrations
        run: |
          python manage.py migrate
