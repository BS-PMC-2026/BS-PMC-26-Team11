<style>
    .site-navbar {
        position: sticky;
        top: 0;
        z-index: 50;
        height: 76px;
        background: #fff;
        border-bottom: 1px solid #eeeeee;
        box-shadow: 0 4px 18px rgba(20, 20, 20, 0.06);
        direction: rtl;
    }

    .site-navbar__inner {
        width: min(1180px, 94%);
        height: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
    }

    .site-navbar__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #151515;
        font-size: 22px;
        font-weight: 900;
        white-space: nowrap;
        text-decoration: none;
    }

    .site-navbar__brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: linear-gradient(135deg, #ef3a22, #d71920);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 18px rgba(215, 25, 32, 0.25);
    }

    .site-navbar__links {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 34px;
        flex: 1;
        color: #303030;
        font-size: 15px;
        font-weight: 700;
    }

    .site-navbar__links a,
    .site-navbar__login,
    .site-navbar__logout {
        color: inherit;
        text-decoration: none;
    }

    .site-navbar__links a.is-active {
        color: #d71920;
    }

    .site-navbar__actions {
        display: flex;
        align-items: center;
        gap: 18px;
        color: #292929;
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
    }

    .site-navbar__login,
    .site-navbar__logout {
        border: 0;
        background: transparent;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: inherit;
        cursor: pointer;
    }

    .site-navbar__cart {
        position: relative;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #222;
        display: grid;
        place-items: center;
        font-size: 22px;
        cursor: pointer;
    }

    .site-navbar__cart:hover {
        background: #f7f7f7;
    }

    .site-navbar__badge {
        position: absolute;
        top: 0;
        left: 0;
        min-width: 20px;
        height: 20px;
        border-radius: 999px;
        background: #d71920;
        color: #fff;
        display: grid;
        place-items: center;
        padding: 0 6px;
        font-size: 12px;
        font-weight: 900;
    }

    @media (max-width: 900px) {
        .site-navbar {
            height: auto;
        }

        .site-navbar__inner {
            padding: 16px 0;
            flex-wrap: wrap;
        }

        .site-navbar__links {
            order: 3;
            flex-basis: 100%;
            flex-wrap: wrap;
            gap: 18px;
        }
    }
</style>

<header class="site-navbar">
    <div class="site-navbar__inner">
        <a href="{% url 'home' %}" class="site-navbar__brand" aria-label="דף הבית">
            <span class="site-navbar__brand-icon">🌶️</span>
            <span>הדינרים</span>
        </a>

        <nav class="site-navbar__links" aria-label="ניווט ראשי">
            <a href="{% url 'home' %}" data-nav-key="home" class="{% if active_nav == 'home' %}is-active{% endif %}">דף הבית</a>
            <a href="{% url 'packages' %}" data-nav-key="tours" class="{% if active_nav == 'tours' %}is-active{% endif %}">סיורים</a>
            <a href="{% url 'home' %}#gallery" data-nav-key="gallery" class="{% if active_nav == 'gallery' %}is-active{% endif %}">גלריה</a>
            <a href="{% url 'home' %}#about" data-nav-key="about" class="{% if active_nav == 'about' %}is-active{% endif %}">אודות</a>
        </nav>

        <div class="site-navbar__actions">
            {% if is_authenticated %}
                <a href="{% url 'logout' %}" class="site-navbar__logout"><span>👤</span><span>התנתקות</span></a>
            {% else %}
                {% if login_modal %}
                    <button type="button" class="site-navbar__login" data-open-login><span>👤</span><span>התחברות</span></button>
                {% else %}
                    <a href="{% url 'login' %}" class="site-navbar__login"><span>👤</span><span>התחברות</span></a>
                {% endif %}
            {% endif %}

            {% if is_authenticated and show_cart %}
                <button type="button" class="site-navbar__cart" data-cart-open aria-label="פתיחת סל הקניות">
                    <span>🛒</span>
                    {% if cart_count > 0 %}<span class="site-navbar__badge">{{ cart_count }}</span>{% endif %}
                </button>
            {% elif is_authenticated and cart_count %}
                <a href="{% url 'my_orders' %}" class="site-navbar__cart" aria-label="סל הקניות">
                    <span>🛒</span>
                    <span class="site-navbar__badge">{{ cart_count }}</span>
                </a>
            {% endif %}
        </div>
    </div>
</header>

<script>
    (function () {
        function syncActiveHash() {
            const hash = window.location.hash.replace('#', '');
            if (!['gallery', 'about'].includes(hash)) return;
            document.querySelectorAll('.site-navbar__links a').forEach(function (link) {
                link.classList.toggle('is-active', link.dataset.navKey === hash);
            });
        }

        syncActiveHash();
        window.addEventListener('hashchange', syncActiveHash);
    })();
</script>
