{% load static %}
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משוב משתמשים - חוות החריף</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        :root {
            --red: #d71920;
            --red-dark: #b9151b;
            --text: #171717;
            --muted: #6f6f6f;
            --border: #ececec;
            --soft: #fafafa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { min-height: 100vh; background: #fff; color: var(--text); direction: rtl; }
        a { color: inherit; text-decoration: none; }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 76px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 18px rgba(20,20,20,0.06);
        }

        .navbar-inner {
            width: min(1180px, 94%);
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #151515;
            font-size: 22px;
            font-weight: 900;
            text-decoration: none;
        }

        .navbar-brand-flame {
            width: 30px;
            height: 30px;
        }

        .navbar-nav {
            display: flex !important;
            flex-direction: row !important;
            gap: 30px;
            flex: 1;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
        }

        .navbar-nav a {
            color: #303030;
            transition: 0.25s;
            padding: 8px 14px;
            border-radius: 999px;
        }

        .navbar-nav a:hover {
            background: #ffe6ea;
            color: var(--red);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-name {
            color: #151515;
            font-weight: 800;
        }

        .logout-btn {
            padding: 8px 14px;
            border-radius: 999px;
            border: 0;
            background: transparent;
            color: #303030;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: #ffe6ea;
            color: var(--red);
        }

        .container {
            width: min(1180px, 94%);
            margin: 0 auto;
            padding: 64px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 0;
        }

        .header p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 0;
        }

        .feedbacks-section {
            margin-top: 64px;
        }

        .feedbacks-section h2 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 24px;
            color: var(--text);
        }

        .table-wrapper {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(0,0,0,0.06);
        }

        .feedbacks-table {
            width: 100%;
            border-collapse: collapse;
        }

        .feedbacks-table thead {
            background: var(--soft);
            border-bottom: 1px solid var(--border);
        }

        .feedbacks-table th {
            padding: 16px 20px;
            text-align: right;
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
        }

        .feedbacks-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .feedbacks-table tbody tr:hover {
            background: var(--soft);
        }

        .feedbacks-table tbody tr:last-child td {
            border-bottom: none;
        }

        .rating-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            background: #fff3cd;
            color: #856404;
        }

        .feedback-content {
            max-width: 400px;
            word-wrap: break-word;
            white-space: normal;
        }

        .feedback-date {
            color: var(--muted);
            font-size: 13px;
        }

        .empty-message {
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px;
            color: var(--muted);
        }

        .stars {
            color: #ffc107;
        }

        @media (max-width: 1150px) {
            .navbar-nav { display: none !important; }
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 24px; }
            .feedbacks-table th, .feedbacks-table td { padding: 12px; }
            .feedback-content { max-width: 200px; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a href="{% url 'home' %}" class="navbar-brand">
            <span>הדינרים</span>
            <svg class="navbar-brand-flame" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M36.8 5.5C39.8 17 55 21.8 55 39.2C55 51.7 44.8 60 32.1 60C19.3 60 9 51.8 9 39.1C9 28.5 15.1 21.2 22.4 14.4C21.7 23.2 27 27.2 31.2 28.9C30.2 18.9 33.1 10.8 36.8 5.5Z"
                      fill="none" stroke="#d71920" stroke-width="6"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <div class="navbar-nav">
            <a href="{% url 'home' %}">דף הבית</a>
            <a href="{% url 'admin_dashboard' %}">לוח בקרה</a>
            <a href="{% url 'package_reservation_admin' %}">זמן שמירה בעגלה</a>
            <a href="{% url 'promotions' %}">הגדרת מבצעים</a>
            <a href="{% url 'admin_feedbacks_page' %}" style="font-weight: 900; color: var(--red);">משוב</a>
        </div>

        <div class="navbar-actions">
            <span class="user-name">{{ full_name }}</span>
            <a href="{% url 'logout' %}" class="logout-btn">התנתקות</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>משוב משתמשים</h1>
        <p>צפה בכל המשובים שהוגשו על ידי משתמשים</p>
    </div>

    <div class="feedbacks-section">
        <div class="table-wrapper">
            <div id="feedbacks-table-container">
                <div class="loading-spinner">
                    <div class="spinner-border" style="color: var(--red);" role="status">
                        <span class="visually-hidden">טוען...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function loadFeedbacks() {
        try {
            const response = await fetch('/api/admin/feedbacks/');

            if (!response.ok) {
                if (response.status === 403) {
                    window.location.href = '/';
                    return;
                }
                throw new Error('Failed to load feedbacks');
            }

            const data = await response.json();
            const container = document.getElementById('feedbacks-table-container');

            if (!data.feedbacks || data.feedbacks.length === 0) {
                container.innerHTML = '<div class="empty-message">אין משובים עדיין</div>';
                return;
            }

            let html = `
                <table class="feedbacks-table">
                    <thead>
                        <tr>
                            <th>שם משתמש</th>
                            <th>תוכן המשוב</th>
                            <th>דירוג</th>
                            <th>תאריך</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.feedbacks.forEach(feedback => {
                const date = new Date(feedback.created_at);
                const formattedDate = date.toLocaleDateString('he-IL', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const stars = '★'.repeat(feedback.rating) + '☆'.repeat(5 - feedback.rating);

                html += `
                    <tr>
                        <td>${escapeHtml(feedback.name)}</td>
                        <td class="feedback-content">${escapeHtml(feedback.content)}</td>
                        <td>
                            <span class="rating-badge">
                                <span class="stars">${stars}</span> ${feedback.rating}/5
                            </span>
                        </td>
                        <td class="feedback-date">${formattedDate}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        } catch (error) {
            console.error('Error loading feedbacks:', error);
            const container = document.getElementById('feedbacks-table-container');
            container.innerHTML = '<div class="empty-message">שגיאה בטעינת המשובים</div>';
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    document.addEventListener('DOMContentLoaded', loadFeedbacks);
</script>
</body>
</html>
